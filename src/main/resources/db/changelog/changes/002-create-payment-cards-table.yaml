databaseChangeLog:
  - changeSet:
      id: 2
      author: dzmitry
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                      primaryKey: true
                      nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: holder
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - addForeignKeyConstraint:
                  baseTableName: payment_cards
                  baseColumnNames: user_id
                  referencedTableName: users
                  referencedColumnNames: id
                  constraintName: fk_payment_cards_user

              - createIndex:
                  tableName: payment_cards
                  indexName: idx_payment_cards_user_id
                  columns:
                    - column:
                        name: user_id
