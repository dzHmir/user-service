spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8081

app:
  cache:
    ttl-minutes: 10
  cards:
    max-active: 5
